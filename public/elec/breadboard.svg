      <circle cx="26" cy="36" r="2.4"/><circle cx="38" cy="36" r="2.4"/><circle cx="50" cy="36" r="2.4"/>
      <circle cx="26" cy="48" r="2.4"/><circle cx="38" cy="48" r="2.4"/><circle cx="50" cy="48" r="2.4"/>
      <circle cx="26" cy="72" r="2.4"/><circle cx="38" cy="72" r="2.4"/><circle cx="50" cy="72" r="2.4"/>
      <circle cx="26" cy="84" r="2.4"/><circle cx="38" cy="84" r="2.4"/><circle cx="50" cy="84" r="2.4"/>
    </g>
    <g>
      <circle cx="70" cy="36" r="2.4"/><circle cx="82" cy="36" r="2.4"/><circle cx="94" cy="36" r="2.4"/>
      <circle cx="70" cy="48" r="2.4"/><circle cx="82" cy="48" r="2.4"/><circle cx="94" cy="48" r="2.4"/>
      <circle cx="70" cy="72" r="2.4"/><circle cx="82" cy="72" r="2.4"/><circle cx="94" cy="72" r="2.4"/>
      <circle cx="70" cy="84" r="2.4"/><circle cx="82" cy="84" r="2.4"/><circle cx="94" cy="84" r="2.4"/>
