<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- WRONG polarity: long leg to − — the LED stays dark. -->
  <line x1="12" y1="40" x2="12" y2="80" stroke="#333" stroke-width="5"/>
  <text x="12" y="30" font-size="18" text-anchor="middle" fill="#333">−</text>
  <line x1="12" y1="60" x2="44" y2="60" stroke="#666" stroke-width="3"/><!-- short leg -->
  <circle cx="60" cy="60" r="16" fill="#c9c9c9" stroke="#999" stroke-width="2"/>
  <line x1="72" y1="60" x2="96" y2="60" stroke="#666" stroke-width="3"/><!-- long leg -->
  <line x1="100" y1="44" x2="100" y2="76" stroke="#333" stroke-width="5"/>
  <text x="100" y="30" font-size="16" text-anchor="middle" fill="#333">+</text>
  <line x1="46" y1="46" x2="74" y2="74" stroke="#999" stroke-width="3"/><!-- struck-through / no glow -->
</svg>
