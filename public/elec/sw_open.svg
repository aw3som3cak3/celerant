<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- PLACEHOLDER elec_switch DISTRACTOR: switch OPEN → loop broken → lamp DARK. Needs real art. -->
  <rect x="20" y="24" width="80" height="72" rx="4" fill="none" stroke="#555" stroke-width="4"/>
  <!-- battery on the left edge -->
  <line x1="14" y1="52" x2="26" y2="52" stroke="#333" stroke-width="6"/>
  <line x1="16" y1="66" x2="24" y2="66" stroke="#333" stroke-width="3"/>
  <!-- switch on the TOP edge, OPEN (lever lifted, gap in the loop) -->
  <circle cx="48" cy="24" r="3" fill="#333"/>
  <circle cx="72" cy="24" r="3" fill="#333"/>
  <line x1="48" y1="24" x2="68" y2="12" stroke="#c0392b" stroke-width="4"/>
  <!-- LED on the right edge, dark -->
  <circle cx="100" cy="60" r="12" fill="#e7e9ec" stroke="#9aa0a8" stroke-width="2"/>
</svg>
